x-database-env: &database-env
  DATABASE_URL: postgresql://postgres:${USER}@db:5432/tech-shop?schema=public
  DATABASE_URL_REPLICA_ADMIN: postgresql://tech_shop_admin:${USER}@db:5432/tech-shop?schema=admin
  DATABASE_URL_REPLICA_CUSTOMER: postgresql://tech_shop_customer:${USER}@db:5432/tech-shop?schema=customer
  DATABASE_URL_REPLICA_EMPLOYEE: postgresql://tech_shop_employee:${USER}@db:5432/tech-shop?schema=employee
  EVENT_SOURCE_DATABASE_URL: postgresql://postgres:${USER}@db:5432/event-source?schema=${SCHEMA_NAME}

x-service-healthcheck: &service-healthcheck
  test: ["CMD", "curl", "-f", "http://${LOCALHOST}:${API_PORT}/healthy"]
  timeout: 5s
  retries: 5

x-base-microservice: &base-microservice
  environment:
    <<: *database-env
    REDIS_SERVER_HOST: redis-storage
    BULLMQ_SERVER_HOST: redis-bullmq
  links:
    - redis-storage
    - redis-bullmq
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    prisma-tech-shop:
      condition: service_started
    redis-storage:
      condition: service_healthy
    redis-bullmq:
      condition: service_healthy

services:
  redis-storage:
    image: redis/redis-stack:latest
    container_name: redis-storage
    ports:
      - ${REDIS_SERVER_PORT}:${REDIS_SERVER_PORT}
      - 8001:8001
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      timeout: 5s
      retries: 3

  redis-bullmq:
    image: redis/redis-stack:latest
    container_name: redis-bullmq
    ports:
      - 6381:${REDIS_SERVER_PORT}
      - 8000:8001
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      timeout: 5s
      retries: 3

  db:
    image: postgres:18
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: tech-shop
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  prisma-tech-shop:
    build:
      context: .
      dockerfile: ./dockerfile/dockerfile.prisma
      args:
        COMMAND: npm run db:deploy
    container_name: prisma-tech-shop
    tty: true
    env_file:
      - .env
    environment:
      <<: *database-env
    ports:
      - 8888:8888
    depends_on:
      db:
        condition: service_healthy

  category:
    <<: *base-microservice
    build:
      context: .
      dockerfile: ./dockerfile/dockerfile.module
      args:
        COMMAND: npm run start:dev category
        MODULE_NAME: category
    container_name: category_c
    env_file:
      - .env
    volumes:
      - share:/api/apps/share
      - generated:/api/generated

  api-gateway:
    <<: *base-microservice
    build:
      context: .
      dockerfile: ./dockerfile/dockerfile.gateway
    env_file:
      - .env
    volumes:
      - api-gateway:/api/apps/api-gateway
      - share:/api/apps/share
      - generated:/api/generated
    container_name: api_c
    ports:
      - ${API_PORT}:${API_PORT}
    depends_on:
      - category

volumes:
  pgdata:
  api-gateway:
  share:
  generated: